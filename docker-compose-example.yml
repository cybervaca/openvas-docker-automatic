version: "3.9"

services:
  openvas:
    image: immauss/openvas:beta
    container_name: openvas
    restart: "on-failure:5"

    # Limites de memoria (anti-OOM)
    mem_limit: 10g
    mem_reservation: 8g

    # Evita que se coma toda la CPU si entra en bucle
    cpus: "2.0"

    ports:
      - "127.0.0.1:9392:9392"   # Web UI solo localhost
      - "127.0.0.1:9390:9390"   # GMP TLS (si gvmd lo expone; en imágenes nuevas puede no haber listener)
      - "127.0.0.1:5432:5432"   # PostgreSQL solo localhost

    volumes:
      - openvas-data:/data
      - /opt/gvm:/opt/gvm
      # Socket gvmd visible en el host para openvas-docker-automatic (modo unix/auto)
      - /opt/gvm/run/gvmd:/run/gvmd

    environment:
      - PASSWORD=admin
      - RELAYHOST=smtp.example.com
      - SMTPPORT=25
      - TZ=Europe/Madrid
      - SKIPSYNC=true

    # Prioridad baja para el OOM killer
    oom_score_adj: -500

volumes:
  openvas-data:

